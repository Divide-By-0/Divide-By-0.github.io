<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Marin Discord Archive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
/* Deliberately single-theme (Discord-like dark) so browsing feels familiar. */
:root {
  color-scheme: dark;
  --rail: #1e1f22; --side: #2b2d31; --main: #313338; --hover: #2e3035; --sel: #404249; --input: #1e1f22;
  --ink: #dbdee1; --ink-strong: #f2f3f5; --muted: #949ba4; --faint: #6d6f78; --line: #3f4147;
  --accent: #5865f2; --link: #00a8fc; --mention-bg: rgba(88,101,242,.3); --code: #2b2d31; --hl: rgba(250,168,26,.12);
  --body: "Noto Sans", "gg sans", "Helvetica Neue", Arial, sans-serif; --mono: "Source Code Pro", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--main); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.375; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* unlock */
#lock { height: 100%; display: grid; place-items: center; padding: 16px; background: var(--rail); }
#lock form { width: 100%; max-width: 420px; background: var(--main); border-radius: 8px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
#lock h1 { margin: 0; font-size: 22px; color: var(--ink-strong); text-align: center; }
#lock p { margin: 0 0 6px; color: var(--muted); font-size: 14px; text-align: center; }
#lock label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); }
#lock input { padding: 10px; border-radius: 4px; border: 0; background: var(--input); color: var(--ink-strong); font: inherit; }
#lock button { padding: 11px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
#lock button:disabled { opacity: .6; cursor: progress; }
#err { color: #fa777c; font-size: 13px; min-height: 1.2em; text-align: center; }

/* app */
#app { height: 100%; display: grid; grid-template-columns: 72px 272px minmax(0,1fr); }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; }
.rail .gicon { width: 48px; height: 48px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.side { background: var(--side); display: flex; flex-direction: column; min-height: 0; }
.side header { padding: 0 16px; height: 48px; display: flex; align-items: center; font-weight: 600; color: var(--ink-strong); box-shadow: 0 1px 0 rgba(0,0,0,.25); flex: none; }
.side .search { padding: 10px 8px 4px; flex: none; }
.side .search input { width: 100%; padding: 6px 8px; border-radius: 4px; border: 0; background: var(--input); color: var(--ink); font: inherit; font-size: 14px; }
.tree { overflow-y: auto; padding: 8px 8px 24px; flex: 1; }
.cat { margin-top: 14px; }
.cat > button { background: none; border: 0; padding: 0 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); cursor: pointer; display: flex; gap: 4px; align-items: center; }
.cat > button:hover { color: var(--ink); }
.chan { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; border-radius: 4px; padding: 5px 8px; color: var(--muted); cursor: pointer; text-align: left; font-size: 15px; }
.chan:hover { background: var(--hover); color: var(--ink); }
.chan[aria-current="true"] { background: var(--sel); color: var(--ink-strong); }
.chan .hash { color: var(--faint); font-size: 18px; line-height: 1; width: 16px; text-align: center; flex: none; }
.chan .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.chan .ct { font-size: 11px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
.threads { margin-left: 20px; border-left: 1px solid var(--line); padding-left: 4px; }
.threads .chan { font-size: 14px; padding: 3px 8px; }
.tmore { background: none; border: 0; color: var(--faint); font-size: 12px; padding: 2px 8px; cursor: pointer; }
.tmore:hover { color: var(--ink); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-shadow: 0 1px 0 rgba(0,0,0,.25); min-width: 0; }
.top .menu { display: none; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; color: var(--ink-strong); }
.crumb .dim { color: var(--muted); font-weight: 500; }
.crumb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .topic { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid var(--line); padding-left: 10px; min-width: 0; }
.top .meta { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
.scroll { overflow-y: auto; flex: 1; padding: 16px 0 32px; }
.more { display: block; margin: 0 auto 12px; background: var(--side); border: 0; border-radius: 4px; padding: 6px 12px; color: var(--ink); cursor: pointer; font-size: 13px; }
.divider { display: flex; align-items: center; gap: 8px; margin: 18px 16px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.msg { display: grid; grid-template-columns: 56px minmax(0,1fr); padding: 2px 16px 2px 0; position: relative; content-visibility: auto; contain-intrinsic-size: 0 48px; }
.msg:hover { background: rgba(2,2,2,.06); }
.msg.head { margin-top: 14px; }
.msg.hl { background: var(--hl); box-shadow: inset 2px 0 0 #faa81a; }
.av { width: 40px; height: 40px; border-radius: 50%; margin: 2px 0 0 16px; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; }
.gutter { font-size: 11px; color: var(--faint); text-align: right; padding: 3px 8px 0 0; visibility: hidden; font-variant-numeric: tabular-nums; }
.msg:hover .gutter { visibility: visible; }
.who { display: flex; align-items: baseline; gap: 8px; }
.who .n { font-weight: 500; color: var(--ink-strong); }
.who .bot { font-size: 10px; background: var(--accent); color: #fff; border-radius: 3px; padding: 0 4px; font-weight: 600; }
.who time { font-size: 12px; color: var(--faint); }
.body { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.body .edited { font-size: 10px; color: var(--faint); margin-left: 4px; }
.body code { font-family: var(--mono); font-size: 85%; background: var(--code); border-radius: 3px; padding: 1px 4px; }
.body pre { font-family: var(--mono); font-size: 13px; background: var(--code); border: 1px solid var(--rail); border-radius: 4px; padding: 8px; margin: 4px 0; white-space: pre-wrap; overflow-x: auto; }
.body .mention { background: var(--mention-bg); color: #c9cdfb; border-radius: 3px; padding: 0 2px; }
.body blockquote { margin: 2px 0; padding-left: 10px; border-left: 4px solid var(--faint); }
.reply { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 2px 0 0 0; cursor: pointer; min-width: 0; grid-column: 2; }
.reply::before { content: ""; width: 26px; height: 10px; border-left: 2px solid var(--line); border-top: 2px solid var(--line); border-top-left-radius: 6px; margin-left: -34px; flex: none; }
.reply b { color: var(--ink); font-weight: 500; flex: none; }
.reply span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sys { color: var(--muted); font-size: 14px; font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { background: var(--side); border: 1px solid var(--line); border-radius: 8px; padding: 1px 7px; font-size: 13px; color: var(--ink); }
.att { background: var(--side); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; margin-top: 4px; display: inline-block; max-width: 100%; color: var(--muted); }
.att b { color: var(--link); font-weight: 500; }
.embed { border-left: 4px solid var(--line); background: var(--side); border-radius: 4px; padding: 8px 12px; margin-top: 4px; max-width: 520px; font-size: 14px; }
.embed .t { font-weight: 600; color: var(--link); display: block; }
.embed .d { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tlink { display: inline-flex; gap: 6px; align-items: center; margin-top: 4px; background: var(--side); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--ink); }
.tlink:hover { border-color: var(--accent); }
.results .r { padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.results .r:hover { background: var(--hover); }
.results .prov { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.results mark { background: rgba(250,168,26,.35); color: inherit; border-radius: 2px; }
.empty { color: var(--muted); padding: 40px 16px; text-align: center; }
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 5; transform: translateX(-100%); transition: transform .15s; }
  #app.nav .side { transform: none; box-shadow: 4px 0 20px rgba(0,0,0,.5); }
  .top .menu { display: block; }
  .top .topic, .top .meta { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="lock">
  <form id="f">
    <h1>Marin Community Archive</h1>
    <p>Read-only archive of the Marin Community Discord: every channel and thread, with provenance. Enter the password to open.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Unlock</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden>
  <nav class="rail" aria-label="Server"><div class="gicon" title="Marin Community">M</div></nav>
  <aside class="side" aria-label="Channels">
    <header id="gname">Marin Community</header>
    <div class="search"><input id="q" type="search" placeholder="Search all messages" aria-label="Search all messages"></div>
    <div class="tree" id="tree"></div>
  </aside>
  <main class="main">
    <div class="top"><button class="menu" id="menu" aria-label="Channels">☰</button><div class="crumb" id="crumb"></div><div class="topic" id="topic"></div><div class="meta" id="meta"></div></div>
    <div class="scroll" id="scroll"></div>
  </main>
</div>
<script>
// Data is published encrypted (AES-256-GCM, key = PBKDF2-SHA256(password)); see scripts/build_discord_viewer.py.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// REASON alt: extra passwords (user 2026-09-29; never name an alt password here: this file ships as public page source). payload.alt holds the page key
// wrapped (AES-GCM) under PBKDF2(alt password, same salt/iter), so an alt password unwraps the SAME key and the one
// ciphertext serves every password. Removing this makes the alt password fail with "wrong password".
async function decryptAny(blob, key) {
  try { return await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct)); }
  catch (e) {
    for (const a of blob.alt || []) {
      try {
        const raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(a.iv) }, key, b64(a.w));
        const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
        return await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, k, b64(blob.ct));
      } catch (_) {}
    }
    throw e;
  }
}
let D, CH = {}, AUTH = {}, MSGIDX = {}, current = null;
const PAGE = 400;

async function decrypt(pw) {
  const blob = await (await fetch("payload.json", { cache: "no-store" })).json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(blob.salt), iterations: blob.iter }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await decryptAny(blob, key);
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}

const PALETTE = ["#5865f2", "#3ba55c", "#faa61a", "#ed4245", "#eb459e", "#9b59b6", "#1abc9c", "#e67e22", "#607d8b", "#2e86c1"];
const avatarColor = i => PALETTE[i % PALETTE.length];
const fmtTime = t => new Date(t * 1000).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const fmtDay = t => new Date(t * 1000).toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
const fmtHM = t => new Date(t * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

function render(text) {
  // Discord-flavoured markdown, minimal and safe: escape first, then add markup.
  const blocks = [];
  let s = esc(text).replace(/```(?:[a-z0-9+-]*\n)?([\s\S]*?)```/gi, (_, c) => { blocks.push(c); return `\u0000${blocks.length - 1}\u0000`; });
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\s)\*([^*\n]+)\*(?=\s|$)/g, "$1<i>$2</i>")
    .replace(/__([^_\n]+)__/g, "<u>$1</u>")
    .replace(/~~([^~\n]+)~~/g, "<s>$1</s>")
    .replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>")
    .replace(/&lt;@!?(\d+)&gt;/g, (_, id) => { const a = D.authors[AUTH[id]]; return `<span class="mention">@${esc(a ? a[1] : "user")}</span>`; })
    .replace(/&lt;#(\d+)&gt;/g, (_, id) => CH[id] ? `<a class="mention" href="#c${id}">#${esc(CH[id].name)}</a>` : "#channel")
    .replace(/&lt;a?:(\w+):\d+&gt;/g, ":$1:")
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre>${blocks[+i]}</pre>`);
}

function prov(c) {
  if (c.thread) { const p = CH[c.categoryId]; return { cat: p ? p.category : "", parent: p ? p.name : c.category, parentId: c.categoryId, thread: c.name }; }
  return { cat: c.category, parent: c.name, parentId: c.id, thread: null };
}

function buildTree() {
  const q = $("#tree"); const cats = {}; const threadsOf = {};
  for (const c of D.channels) {
    if (c.thread) (threadsOf[c.categoryId] ||= []).push(c);
    else (cats[c.category || "Uncategorized"] ||= []).push(c);
  }
  let open = {}; try { open = JSON.parse(localStorage.getItem("mda-open") || "{}"); } catch (e) {}
  q.innerHTML = Object.entries(cats).map(([cat, list]) => `
    <div class="cat"><button data-cat="${esc(cat)}" aria-expanded="${open[cat] !== false}">▾ ${esc(cat)}</button>
      <div class="catbody" ${open[cat] === false ? "hidden" : ""}>
      ${list.map(c => {
        const th = (threadsOf[c.id] || []).sort((a, b) => (b.last || 0) - (a.last || 0));
        return `<button class="chan" data-id="${c.id}"><span class="hash">${c.forum ? "▤" : "#"}</span><span class="nm">${esc(c.name)}</span><span class="ct">${c.forum ? (threadsOf[c.id] || []).length + " posts" : c.n}</span></button>` +
          (th.length ? `<div class="threads" data-parent="${c.id}">${th.map((t, i) => `<button class="chan" data-id="${t.id}" ${i >= 5 ? "hidden" : ""}><span class="hash">↳</span><span class="nm">${esc(t.name)}</span><span class="ct">${t.n}</span></button>`).join("")}${th.length > 5 ? `<button class="tmore" data-more="${c.id}">Show all ${th.length} threads</button>` : ""}</div>` : "");
      }).join("")}
      </div></div>`).join("");
  q.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.cat != null) { const body = b.nextElementSibling; body.hidden = !body.hidden; b.setAttribute("aria-expanded", String(!body.hidden)); open[b.dataset.cat] = !body.hidden; try { localStorage.setItem("mda-open", JSON.stringify(open)); } catch (e) {} return; }
    if (b.dataset.more) { b.parentElement.querySelectorAll(".chan[hidden]").forEach(x => x.hidden = false); b.remove(); return; }
    if (b.dataset.id) { location.hash = "c" + b.dataset.id; $("#app").classList.remove("nav"); }
  };
}

function msgHTML(c, m, prev) {
  const [id, t, ai, content, ref, att, emb, rea, edited, type] = m;
  const a = D.authors[ai] || ["?", "?", null, false];
  const head = !prev || prev[2] !== ai || t - prev[1] > 420 || type === "R" || prev[9] === "S";
  let inner = "";
  if (type === "R" && ref && MSGIDX[ref]) {
    const [rc, rm] = MSGIDX[ref]; const ra = D.authors[rm[2]] || ["?", "?"];
    inner += `<div class="reply" data-jump="${rc}:${ref}"><b>@${esc(ra[1])}</b><span>${esc((rm[3] || "(attachment)").slice(0, 140))}</span></div>`;
  }
  let body;
  if (type === "T") body = `<div class="sys">started a thread${CH[ref] ? `: <a href="#c${ref}">${esc(CH[ref].name)}</a>` : ""}</div>`;
  else if (type === "P") body = `<div class="sys">pinned a message</div>`;
  else if (type === "N") body = `<div class="sys">renamed the channel: ${esc(content)}</div>`;
  else if (type === "S") {
    const src = ref && MSGIDX[ref];
    body = src ? `<div class="sys">Thread started from a message in #${esc(CH[src[0]].name)} · <a href="#c${src[0]}m${ref}">jump to it</a></div>` : "";
    if (src) { const sm = src[1]; const sa = D.authors[sm[2]] || ["?", "?"]; body += `<div class="body"><b>${esc(sa[1])}:</b> ${render(sm[3])}</div>`; }
  } else body = `<div class="body">${render(content)}${edited ? '<span class="edited">(edited)</span>' : ""}</div>`;
  if (att.length) body += att.map(x => `<div class="att">📎 <b>${esc(x[0])}</b> · ${(x[1] / 1024).toFixed(0)} KB (file not archived)</div>`).join("");
  if (emb.length) body += emb.map(e => `<div class="embed">${e[1] ? `<a class="t" href="${esc(e[1])}" target="_blank" rel="noopener noreferrer">${esc(e[0] || e[1])}</a>` : `<span class="t">${esc(e[0])}</span>`}${e[2] ? `<div class="d">${esc(e[2])}</div>` : ""}</div>`).join("");
  if (rea.length) body += `<div class="chips">${rea.map(r => `<span class="chip">${esc(r[0])} ${r[1]}</span>`).join("")}</div>`;
  if (CH[id] && CH[id].thread) body += `<div><span class="tlink" data-open="${id}">🧵 ${esc(CH[id].name)} · ${CH[id].n} messages</span></div>`;
  if (head) return `<div class="msg head" id="m${id}">${inner ? `<div></div>${inner}` : ""}<div class="av" style="background:${a[2] || avatarColor(ai)}">${esc((a[1] || "?")[0].toUpperCase())}</div><div><div class="who"><span class="n" style="${a[2] ? `color:${a[2]}` : ""}">${esc(a[1])}</span>${a[3] ? '<span class="bot">BOT</span>' : ""}<time title="${fmtTime(t)}">${fmtTime(t)}</time></div>${body}</div></div>`;
  return `<div class="msg" id="m${id}"><div class="gutter">${fmtHM(t)}</div><div>${body}</div></div>`;
}

function openChannel(cid, focus) {
  const c = CH[cid]; if (!c) return;
  current = cid;
  document.querySelectorAll(".chan").forEach(b => b.setAttribute("aria-current", String(b.dataset.id === cid)));
  const el = document.querySelector(`.chan[data-id="${cid}"]`);
  if (el) { if (el.hidden) el.hidden = false; const cb = el.closest(".catbody"); if (cb) cb.hidden = false; el.scrollIntoView({ block: "nearest" }); }
  const p = prov(c);
  $("#crumb").innerHTML = `<span class="dim">${esc(p.cat)}</span><span class="dim">›</span>` + (c.thread ? `<a href="#c${p.parentId}" class="dim"># ${esc(p.parent)}</a><span class="dim">›</span><span>🧵 ${esc(c.name)}</span>` : `<span># ${esc(c.name)}</span>`);
  $("#topic").textContent = c.topic || "";
  $("#meta").textContent = c.n ? `${c.n} messages · ${new Date(c.first * 1000).toLocaleDateString()} – ${new Date(c.last * 1000).toLocaleDateString()}` : "no messages visible";
  const rows = D.messages[cid] || [];
  let start = Math.max(0, rows.length - PAGE);
  if (focus) { const i = rows.findIndex(r => r[0] === focus); if (i >= 0 && i < start) start = Math.max(0, i - 50); }
  draw(rows, start, focus);
}

function draw(rows, start, focus) {
  const sc = $("#scroll");
  if (!rows.length) { sc.innerHTML = `<div class="empty">${CH[current] && CH[current].forum ? "This is a forum channel: its posts are the threads listed under it in the sidebar." : "No messages visible in this channel."}</div>`; return; }
  let html = start > 0 ? `<button class="more" id="older">Load ${Math.min(PAGE, start)} earlier messages</button>` : "";
  let lastDay = "";
  for (let i = start; i < rows.length; i++) {
    const day = fmtDay(rows[i][1]);
    if (day !== lastDay) { html += `<div class="divider">${day}</div>`; lastDay = day; }
    html += msgHTML(CH[current], rows[i], i > start ? rows[i - 1] : null);
  }
  sc.innerHTML = html;
  const older = $("#older"); if (older) older.onclick = () => { const h = sc.scrollHeight; draw(rows, Math.max(0, start - PAGE)); sc.scrollTop = sc.scrollHeight - h; };
  if (focus) { const m = document.getElementById("m" + focus); if (m) { m.classList.add("hl"); m.scrollIntoView({ block: "center" }); } }
  else sc.scrollTop = sc.scrollHeight;
}

let sTimer;
function search(qs) {
  const q = qs.trim().toLowerCase();
  if (q.length < 2) { if (current) openChannel(current); return; }
  const res = [];
  for (const c of D.channels) for (const m of D.messages[c.id]) {
    if (m[3] && m[3].toLowerCase().includes(q)) { res.push([c, m]); if (res.length >= 300) break; }
  }
  $("#crumb").innerHTML = `<span>Search: “${esc(qs)}”</span>`; $("#topic").textContent = ""; $("#meta").textContent = `${res.length >= 300 ? "300+" : res.length} results`;
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  $("#scroll").innerHTML = res.length ? `<div class="results">${res.map(([c, m]) => {
    const p = prov(c), a = D.authors[m[2]] || ["?", "?"]; const txt = m[3]; const i = txt.toLowerCase().indexOf(q);
    const snip = esc(txt.slice(Math.max(0, i - 80), i + 160)).replace(rx, x => `<mark>${x}</mark>`);
    return `<div class="r" data-c="${c.id}" data-m="${m[0]}"><div class="prov">${esc(p.cat)} › #${esc(p.parent)}${p.thread ? ` › 🧵 ${esc(p.thread)}` : ""} · ${esc(a[1])} · ${fmtTime(m[1])}</div><div>${snip}</div></div>`;
  }).join("")}</div>` : `<div class="empty">No messages match.</div>`;
}

function route() {
  const h = location.hash.slice(1); const mm = /^c(\d+)(?:m(\d+))?$/.exec(h);
  if (mm) openChannel(mm[1], mm[2]);
  else { const g = D.channels.find(c => !c.thread && c.name === "general") || D.channels[0]; openChannel(g.id); }
}

function start(data) {
  D = data;
  D.channels.forEach(c => CH[c.id] = c);
  Object.entries(D.authorIds).forEach(([i, id]) => AUTH[id] = +i);
  for (const c of D.channels) for (const m of D.messages[c.id]) MSGIDX[m[0]] = [c.id, m];
  $("#gname").textContent = D.guild; $("#lock").hidden = true; $("#app").hidden = false;
  buildTree();
  $("#q").oninput = e => { clearTimeout(sTimer); sTimer = setTimeout(() => search(e.target.value), 200); };
  $("#scroll").onclick = e => {
    const r = e.target.closest(".r"); if (r) { $("#q").value = ""; location.hash = `c${r.dataset.c}m${r.dataset.m}`; return; }
    const j = e.target.closest("[data-jump]"); if (j) { const [c, m] = j.dataset.jump.split(":"); location.hash = `c${c}m${m}`; return; }
    const t = e.target.closest("[data-open]"); if (t) location.hash = "c" + t.dataset.open;
  };
  $("#menu").onclick = () => $("#app").classList.toggle("nav");
  addEventListener("hashchange", route);
  route();
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault(); const go = $("#go"), err = $("#err"); err.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
  try { const data = await decrypt($("#pw").value); try { sessionStorage.setItem("mda-pw", $("#pw").value); } catch (x) {} start(data); }
  catch (x) { err.textContent = "That password didn't work. Check it and try again."; go.disabled = false; go.textContent = "Unlock"; }
});
let saved = null; try { saved = sessionStorage.getItem("mda-pw"); } catch (e) {}
if (saved) decrypt(saved).then(start).catch(() => { try { sessionStorage.removeItem("mda-pw"); } catch (e) {} });
</script>

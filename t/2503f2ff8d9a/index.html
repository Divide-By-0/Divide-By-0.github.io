// REASON alt: extra passwords (user 2026-09-29: "make the password 'qasim' work"). Each entry is the page key K
// wrapped (AES-GCM) under PBKDF2(alt password, same salt), so any listed password unwraps the SAME K. Storing K
// (not the alt-derived key) in tb_key keeps one entry opening every board and trace. "W3siaXYiOiAiUHRFOUZLM3Rhazl2QlNSdiIsICJ3IjogIlpqUmJTbmhYd3NTUEc5NnJUT0NpWXFFWkVMeFBHS2Vkdmk1TGNrY2VQY3Z4NEZrVUxGSERqOEh3WjNBL0ZQeWEifV0=" left unreplaced = none.
const ALT=D.alt.startsWith("__")?[]:JSON.parse(atob(D.alt));
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// Scope by salt so unrelated boards cannot erase one another's remembered key.
const cacheName="tb_key:"+D.salt;
const parsed=document.readyState==="loading"
  ? new Promise(resolve=>document.addEventListener("DOMContentLoaded",resolve,{once:true}))
  : Promise.resolve();
function readSaved(persistent){
  try{ return (persistent?localStorage:sessionStorage).getItem(persistent?cacheName:"tb_key"); }catch(_){ return null; }
}
async function openWith(key, rawToSave){
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},key,u(D.ct)));
  if(rawToSave){
    const encoded=btoa(String.fromCharCode(...rawToSave));
    // Persist only the successfully verified page key, never the password.
    try{ localStorage.setItem(cacheName,encoded); }catch(_){}
    // Older published loaders still use the tab-local key.
    try{ sessionStorage.setItem("tb_key",encoded); }catch(_){}
  }
  // While parsing a streamed response document.open() is ignored and write()
  // inserts the board below the gate. Replace only after parsing has finished.
  await parsed;
  document.open(); document.write(html); document.close();
  // REASON (artifact-mirror): the Tinker loader reloads every 5 min because that board is rebuilt by cron.
  // Mirrored artifacts only change when someone runs publish.py, so a reload would just drop the reader's scroll
  // position and open panels. Copied from extrapolate_hud scripts/tinker_training/board/loader.html on 2026-10-03.
}
(async()=>{
  await parsed;
  for(const saved of new Set([readSaved(true),readSaved(false)])){
    if(!saved) continue;
    try{
      const raw=u(saved);
      await openWith(await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]),raw);
      return;
    }catch(_){} // A bad/stale entry must not prevent manual unlock or erase other boards' access.
  }
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const err=document.getElementById("err"); err.textContent="Decrypting…";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
    try{ await openWith(key, raw); return; }catch(_){}
    for(const a of ALT){
      try{
        const k=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(a.iv)},key,u(a.w)));
        await openWith(await crypto.subtle.importKey("raw",k,"AES-GCM",false,["decrypt"]), k); return;
      }catch(_){}
    }
    err.textContent="Wrong password.";
  }catch(_){ err.textContent="Wrong password."; }
});
